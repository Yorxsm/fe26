name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: README API paths exist in OpenAPI
        run: cargo test -p fe2vi-api --lib readme_endpoints_are_in_openapi
      - name: wasm
        run: cargo build --release --target wasm32-unknown-unknown -p arena-factory -p arena-registry -p heist-game -p war-room -p skin-forge -p fe2vi-api
      - name: wasm clippy
        run: cargo clippy --target wasm32-unknown-unknown -p arena-factory -p arena-registry -p heist-game -p war-room -p skin-forge -p fe2vi-api -- -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Room interior is not empty
        run: |
          npx next start -p 3210 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:3210/ && break; sleep 1; done
          node scripts/check-room.mjs http://127.0.0.1:3210

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz -C /tmp
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose
