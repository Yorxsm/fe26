name = "fe2vi-api"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-15"
workers_dev = false

# Served at https://api.fe2vi.space as a Workers Custom Domain.
routes = [
  { pattern = "api.fe2vi.space", custom_domain = true }
]

# Build the wasm shim with worker-build, then deploy with `wrangler deploy`.
[build]
command = "worker-build --release"

[durable_objects]
bindings = [
  { name = "SPECTATOR", class_name = "SpectatorFeed" }
]

[[migrations]]
tag = "v1"
# SQLite-backed Durable Objects (required on the Workers Free plan).
new_sqlite_classes = ["SpectatorFeed"]

# Cron runs on the deployed worker every five minutes.
[triggers]
crons = ["*/5 * * * *"]

# Numbers match workers/api/src/limits.rs. The binding period can only be 10 or 60.
[[ratelimits]]
name = "REGISTER_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ACTION_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[vars]
# Chain network. The web worker's FE2VI_NETWORK=arena is the off-chain arena label, not this.
# These ids are the disposable testnet deployment. They are not the fe2vi.testnet contracts.
FE2VI_NETWORK = "testnet"
FE2VI_RPC_URL = "https://rpc.testnet.fastnear.com"
FE2VI_FACTORY_ID = "factory.fe2vidisp7a3c.testnet"
FE2VI_REGISTRY_ID = "registry.fe2vidisp7a3c.testnet"
FE2VI_HEIST_ID = "heist.fe2vidisp7a3c.testnet"
FE2VI_PASSPORT_ID = "passport.fe2vidisp7a3c.testnet"
# Career and playbook reads. Market, bind, and Vault stay on FE2VI_PASSPORT_ID.
FE2VI_PASSPORT_RECORDER_ID = "passport.fe2virecdb1e91.testnet"
# Market for recorder-passport listings. Empty until that market account is deployed.
FE2VI_RECORDER_MARKET_ID = "market.fe2virecdb1e91.testnet"
# Factory owner from get_owner. FE2VI_SETTLER_SECRET_KEY is that account's key (secret).
FE2VI_SETTLER_ACCOUNT = "fe2vidisp7a3c.testnet"
# Recorder signer. is_recorder is already true, so set_recorder is not required.
# Secret: FE2VI_RECORDER_SECRET_KEY.
FE2VI_RECORDER_ACCOUNT = "fe2virecdb1e91.testnet"
FE2VI_PASSPORT_MARKET_ID = "market.fe2vidisp7a3c.testnet"
FE2VI_ESCROW_ID = "heist.fe2vidisp7a3c.testnet"
# off | warn | on. Keep off until legacy agents have passports.
FE2VI_PASSPORT_GATE = "on"
# Launch stock is pre-minted and listed at 1 NEAR. Agents buy, not mint.
FE2VI_PASSPORT_MINT = "off"
# FE2VI_PASSPORT_RELAY_KEY is a secret: `wrangler secret put FE2VI_PASSPORT_RELAY_KEY`.
# The CLI relay uses the same value in its environment.
# Deployed to api.fe2vi.space (see routes above). Chain calls use the testnet RPC above.
# The Intents partner key is a secret. Do not put it in [vars].
# `POST /v1/intents/act` submits a signed intent only when this secret is set.
# Without it the route fails closed and does not report a broadcast.
# wrangler secret put NEAR_INTENTS_AGENT_API_KEY
FE2VI_INTENTS_LIVE = "0"
# Testnet sandbox. The official Agent API host is mainnet and is refused.
NEAR_INTENTS_AGENT_API_URL = "https://www.usetidepool.tech"
