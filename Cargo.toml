[workspace]
resolver = "2"
exclude = ["contracts/sandbox-tests", "vendor/near-intents-agent-api"]
members = [
    "crates/fe2vi-core",
    "crates/fe2vi-intents",
    "crates/cli",
    "contracts/arena-factory",
    "contracts/arena-registry",
    "contracts/heist-game",
    "contracts/war-room",
    "workers/api",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
borsh = { version = "1", features = ["derive"] }
fe2vi-core = { path = "crates/fe2vi-core", features = ["borsh"] }
